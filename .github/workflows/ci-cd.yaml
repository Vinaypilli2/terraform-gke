name: Build & Test Maven Project

on:
  push:
    branches:
      - feature/create-bucket    # Trigger on your feature/create-bucket branch
  pull_request:
    branches:
      - feature/create-bucket    # Trigger on pull request to your feature/create-bucket branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install dependencies and run tests
      run: mvn install

    # Step: Authenticate to Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Step: Set up Google Cloud SDK
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Step: Configure Docker to use Google Cloud Registry
    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    # Step: Build and push Docker image to GCR
    - name: Build and Push Docker Image
      run: |
        IMAGE_NAME=${{ github.event.repository.name }}  # Use repo name as the image name
        PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}       # From GitHub Secrets
        GCR_REPO=${{ secrets.GCP_GCR_REPO }}           # From GitHub Secrets (GCR repo name)

        # Build the Docker image
        docker build -t gcr.io/${PROJECT_ID}/${GCR_REPO}/${IMAGE_NAME}:latest .

        # Push the Docker image to Google Container Registry
        docker push gcr.io/${PROJECT_ID}/${GCR_REPO}/${IMAGE_NAME}:latest
