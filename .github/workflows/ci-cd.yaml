name: Build & Test Maven Project

on:
  push:
    branches:
      - feature/create-bucket    # Trigger on your feature/create-bucket branch
    paths-ignore:
      - 'helm/**'                # Ignore changes in the helm directory
      - 'k8s/**'                  # Ignore changes in the k8s directory
      - 'README.md'               # Ignore changes to the README file
  pull_request:
    branches:
      - feature/create-bucket    # Trigger on pull request to your feature/create-bucket branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install dependencies and run tests
      run: mvn install

    # Step: Authenticate to Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Step: Set up Google Cloud SDK
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Step: Configure Docker to use Google Cloud Registry
    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    # Step: Build and push Docker image to GCR
    - name: Build and Push Docker Image
      run: |
        IMAGE_NAME=${{ github.event.repository.name }}  # Use repo name as the image name
        PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}       # From GitHub Secrets
        GCR_REPO=${{ secrets.GCP_GCR_REPO }}           # From GitHub Secrets (GCR repo name)
        GITHUB_RUN_ID=${{ github.run_id }}             # GitHub run ID for the tag

        # Build the Docker image with the GitHub run ID as the tag
        docker build -t gcr.io/${PROJECT_ID}/${GCR_REPO}/${IMAGE_NAME}:${GITHUB_RUN_ID} .

        # Push the Docker image to Google Container Registry with the GitHub run ID as the tag
        docker push gcr.io/${PROJECT_ID}/${GCR_REPO}/${IMAGE_NAME}:${GITHUB_RUN_ID}

  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: build  # This ensures the image build happens before updating the Helm chart

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        token: ${{ secrets.TOKEN }}

    - name: Update tag in Helm chart
      run: |
        # Update the image tag in the values.yaml file
        sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/tf-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "vinaypilli56@gmail.com"
        git config --global user.name "Vinaypilli2"
        git add helm/tf-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push
